  /v2/withdraw/{network}/{ticker}:
    post:
      x-zudoku-playground-enabled: false
      tags:
      - Fund Management
      summary: Withdraw Crypto Funds
      operationId: withdrawCryptoFunds
      description: 'The v1 withdraw endpoint is being retired. This v2 endpoint is the recommended replacement, offering explicit blockchain network selection for multi-network tokens. Please migrate to this endpoint at your earliest convenience.


        Withdraw cryptocurrency funds to an approved address, with explicit network selection.


        The key improvement over v1 is the explicit `network` path parameter, which allows you to specify exactly which blockchain network to use for the withdrawal. This is especially important for tokens available on multiple networks (e.g., USDC on Ethereum, Solana, Base, Arbitrum, etc.).


        Before you can withdraw cryptocurrency funds to an approved address, you need three things:


        1. You must have an approved address list for your account

        2. The address you want to withdraw funds to needs to already be on that approved address list

        3. An API key with the Fund Manager role added


        If you would like to withdraw via API to addresses that are not on your approved address list, please reach out to trading@gemini.com. We can enable this feature for you provided a set of approved IP addresses. This functionality is only available for exchange accounts. Pre-approved IP addresses and addresses added to your approved address list are required to enable withdrawal APIs for custody accounts.


        Use the Get Network endpoint to discover which networks support withdrawals for a given token.


        See Roles for more information on how to add the Fund Manager role to the API key you want to use.


        ### Roles

        The API key you use to access this endpoint must have the Fund Manager role assigned. See Roles for more information.


        The OAuth scope must have `crypto:send` assigned to access this endpoint. See OAuth Scopes for more information.'
      parameters:
      - $ref: '#/components/parameters/networkParam'
      - name: ticker
        in: path
        required: true
        schema:
          type: string
        description: The cryptocurrency ticker code (e.g., `btc`, `eth`, `usdc`). See [Symbols and minimums](/market-data/symbols-and-minimums).
        example: eth
      - $ref: '#/components/parameters/apiKeyAuth'
      - $ref: '#/components/parameters/signatureAuth'
      - $ref: '#/components/parameters/payloadAuth'
      - $ref: '#/components/parameters/contentType'
      - $ref: '#/components/parameters/contentLength'
      - $ref: '#/components/parameters/cacheControl'
      security:
      - apiKeyAuth: []
        signatureAuth: []
        payloadAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - address
              - amount
              properties:
                address:
                  type: string
                  description: The destination address for the withdrawal
                amount:
                  type: string
                  description: The amount to withdraw
                memo:
                  type: string
                  description: Required for certain networks that use memos (e.g., Solana, XRP, Cosmos). The destination tag or memo for the withdrawal.
                clientTransferId:
                  type: string
                  format: uuid
                  description: A unique UUID for idempotent withdrawals. If provided, duplicate requests with the same `clientTransferId` will not create additional withdrawals.
            examples:
              btcWithdrawal:
                summary: BTC Withdrawal on Bitcoin
                description: JSON payload for BTC withdrawal on the Bitcoin network
                value:
                  address: mi98Z9brJ3TgaKsmvXatuRahbFRUFKRUdR
                  amount: '1'
              ethWithdrawal:
                summary: ETH Withdrawal on Ethereum
                description: JSON payload for ETH withdrawal on the Ethereum network with client transfer ID
                value:
                  address: '0xA63123350Acc8F5ee1b1fBd1A6717135e82dBd28'
                  amount: '2.34567'
                  clientTransferId: AA97B177-9383-4934-8543-0F91A7A02838
              usdcWithdrawalSolana:
                summary: USDC Withdrawal on Solana
                description: JSON payload for USDC withdrawal on the Solana network
                value:
                  address: 7EcDhSYGxXyscszYEp35KHN8vvw3svAuLKTzXwCFLtV
                  amount: '100'
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WithdrawCryptoFundsResponse'
              examples:
                btcWithdrawalResponse:
                  summary: BTC Withdrawal Response
                  description: JSON response for BTC withdrawal on Bitcoin network
                  value:
                    withdrawalId: 02176a83-a6b1-4202-9b85-1c1c92dd25c4
                    address: mi98Z9brJ3TgaKsmvXatuRahbFRUFKRUdR
                    amount: '1'
