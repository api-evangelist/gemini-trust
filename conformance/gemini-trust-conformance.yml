- id: fdx
  name: Financial Data Exchange
  conforms: true
  evidence: 'https://api.gemini.com/.well-known/oauth-authorization-server publishes six FDX-namespaced scopes: fdx:accountbasic:read,
    fdx:accountdetailed:read, fdx:customercontact:read, fdx:rewards:read, fdx:statements:read, fdx:transactions:read'
  surface: OAuth 2.0 delegated access. The scope names map one-to-one onto the FDX API data clusters (Account Basic,
    Account Detailed, Customer Contact, Rewards, Statements, Transactions).
  note: Found in the CONTRACT (live RFC 8414 metadata), not in prose. Gemini does not advertise FDX anywhere in its
    developer documentation, so this signature would be invisible to a docs-only reading. fdx is on the banking_open_finance
    standards shortlist in scoring.yml; a crypto exchange publishing FDX scopes is what data aggregators need to consume
    Gemini account data without a bespoke connector.
