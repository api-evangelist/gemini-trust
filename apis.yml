apis:
- name: Gemini WebSocket API
  description: >-
    The production Gemini WebSocket API at wss://ws.gemini.com: request/response methods, market data
    streams (book ticker, partial and differential depth, trades), authenticated account streams for orders,
    balances and positions, prediction-market contract lifecycle, and combo RFQ messages. Published as
    AsyncAPI 3.0.0 with 21 channels and 22 operations.
  image: https://gemini.com/static/images/gemini-logomark.png
  humanURL: https://developer.gemini.com/websocket/introduction
