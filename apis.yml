- aid: gemini-trust:gemini-trust-rewards-api
  name: Gemini Trust Company Rewards API
  description: >-
    Endpoints for the Maker Rebate and Liquidity Rewards programs.


    - **Maker Rebate** — per-fill rebates earned by resting limit orders that get filled. Rates and rebate
    multipliers are configured per category. Public rate schedule plus authenticated payout and summary
    endpoints.

    - **Liquidity Rewards** — daily USD reward pools distributed across qualifying makers based on quote
    uptime, spread, and size. Public config + event listing, authenticated daily and lifetime summary
    endpoints.


    When a program is not active, its endpoints return `503 Service Unavailable`.


    **Note on field naming.** Response fields under the Rewards endpoints use `snake_case` (e.g. `event_ticker`,
    `daily_pool_usd`). This differs from the `camelCase` convention used by the rest of the Prediction
    Markets REST endpoints.
  humanURL: https://developer.gemini.com/rest-api/rest-api
  baseURL: https://api.gemini.com
  tags:
  - Rewards
