openapi: 3.2.0
info:
  title: REST Fund Management API
  description: 'The Gemini Crypto Exchange REST API allows programmatic access to trade cryptocurrencies

    and manage your account on the Gemini Exchange platform. The API provides both public and

    private endpoints for market data, order management, and account operations.'
  version: 1.0.0
  contact:
    name: Gemini Trading Support
    email: trading@gemini.com
servers:
- url: https://api.gemini.com
  description: Production server
- url: https://api.sandbox.gemini.com
  description: Sandbox server for testing
tags:
- name: Fund Management
paths:
  /v1/balances:
    post:
      x-zudoku-playground-enabled: false
      tags:
      - Fund Management
      summary: Get Available Balances
      operationId: getAvailableBalances
      description: 'Under the terms of the Gemini API Agreement, polling this endpoint may be subject to rate limiting.


        This will show the available balances in the supported currencies


        Please note that Gemini is currently in the process of introducing new API architecture that will impact how decimal balances are returned from this endpoint for fiat and crypto assets.


        As a result of this change, requests to the balances endpoint routed via the new architecture will return fiat balances and crypto balances truncated to 15 and 19 decimal places, respectively. This change has been introduced to correct for the display of miniscule residual values that do not actually represent usable balances.


        It is recommended that users floor the values returned from this endpoint to the correct precision until the migration to the new architecture has been completed.


        ### Roles

        The API key you use to access this endpoint must have the Trader, Fund Manager or Auditor role assigned. See Roles for more information.


        The OAuth scope must have `balances:read` assigned to access this endpoint. See OAuth Scopes for more information.'
      parameters:
      - $ref: '#/components/parameters/apiKeyAuth'
      - $ref: '#/components/parameters/signatureAuth'
      - $ref: '#/components/parameters/payloadAuth'
      - $ref: '#/components/parameters/contentType'
      - $ref: '#/components/parameters/contentLength'
      - $ref: '#/components/parameters/cacheControl'
      security:
      - apiKeyAuth: []
        signatureAuth: []
        payloadAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - request
              - nonce
              - account
              properties:
                request:
                  type: string
                  description: The API endpoint path
                  example: /v1/balances
                nonce:
                  type: TimestampType
                  $ref: '#/components/schemas/TimestampType'
                  title: The nonce, as described in [Private API Invocation](/authentication/api-key#private-api-invocation)
                account:
                  description: Required for Master API keys as described in [Private API Invocation](/authentication/api-key#private-api-invocation). The name of the account within the subaccount group. Specifies the account on which you intend to place the order. Only available for exchange accounts.
                  type: string
                  example: primary
                showPendingBalances:
                  description: 'Whether to include pending balances such as in-flight crypto deposits or withdrawals in the balances response.


                    > **Note:** Setting this field to `true` will result in slower response times due to additional database lookups required to retrieve pending balance information.

                    '
                  default: false
                  type: boolean
                  example: false
            example:
              request: /v1/balances
              nonce: <nonce>
              account: primary
              showPendingBalances: false
      responses:
        '200':
          description: The account balances
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Balance'
              examples:
                multipleBalances:
                  summary: Multiple Balances
                  description: Response with multiple currency balances (showPendingBalances = false)
                  value:
                  - type: exchange
                    currency: BTC
                    amount: '5.0'
                    available: '4.5'
                    availableForWithdrawal: '4.5'
                    _timestamp: '2024-03-16T00:00:00.000000Z'
                  - type: exchange
                    currency: USD
                    amount: '15000.00'
                    available: '5000.00'
                    availableForWithdrawal: '5000.00'
                    _timestamp: '2024-03-16T00:00:00.000000Z'
                  - type: exchange
                    currency: ETH
                    amount: '10.0'
                    available: '10.0'
                    availableForWithdrawal: '10.0'
                    _timestamp: '2024-03-16T00:00:00.000000Z'
                emptyBalances:
                  summary: Empty Balances
                  description: Response when there are no balances
                  value: []
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/ApiKeyIpFilteringFailure'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
  /v1/notionalbalances/{currency}:
    post:
      x-zudoku-playground-enabled: false
      tags:
      - Fund Management
      summary: Get Notional Balances
      operationId: getNotionalBalances
      description: 'Under the terms of the Gemini API Agreement, polling this endpoint may be subject to rate limiting.


        This will show the available balances in the supported currencies as well as the notional value in the currency specified.


        Please note that Gemini is currently in the process of introducing new API architecture that will impact how decimal balances are returned from this endpoint for fiat and crypto assets.


        As a result of this change, requests to the notional balances endpoint routed via the new architecture will return fiat balances and crypto balances truncated to 15 and 19 decimal places, respectively. This change has been introduced to correct for the display of miniscule residual values that do not actually represent usable balances.


        It is recommended that users floor the values returned from this endpoint to the correct precision until the migration to the new architecture has been completed.


        ### Roles

        The API key you use to access this endpoint must have the Trader, Fund Manager or Auditor role assigned. See Roles for more information.


        The OAuth scope must have `balances:read` assigned to access this endpoint. See OAuth Scopes for more information.'
      parameters:
      - $ref: '#/components/parameters/currencyParam'
      - $ref: '#/components/parameters/apiKeyAuth'
      - $ref: '#/components/parameters/signatureAuth'
      - $ref: '#/components/parameters/payloadAuth'
      - $ref: '#/components/parameters/contentType'
      - $ref: '#/components/parameters/contentLength'
      - $ref: '#/components/parameters/cacheControl'
      security:
      - apiKeyAuth: []
        signatureAuth: []
        payloadAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - request
              - nonce
              properties:
                request:
                  type: string
                  description: The literal string "/v1/notionalbalances/currency"
                nonce:
                  $ref: '#/components/schemas/Nonce'
                account:
                  type: string
                  description: Required for Master API keys. The name of the account within the subaccount group.
            examples:
              basic:
                summary: Basic Request
                description: Basic request to get notional balances in USD
                value:
                  request: /v1/notionalbalances/usd
                  nonce: <nonce>
              withAccount:
                summary: With Account Parameter
                description: Request with account parameter for Master API keys
                value:
                  request: /v1/notionalbalances/usd
                  nonce: <nonce>
                  account: primary
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/NotionalBalance'
              example:
              - currency: BTC
                amount: '1154.62034001'
                amountNotional: '10386000.59'
                available: '1129.10517279'
                availableNotional: '10161000.71'
                availableForWithdrawal: '1129.10517279'
                availableForWithdrawalNotional: '10161000.71'
              - currency: USD
                amount: '18722.79'
                amountNotional: '18722.79'
                available: '14481.62'
                availableNotional: '14481.62'
                availableForWithdrawal: '14481.62'
                availableForWithdrawalNotional: '14481.62'
              - currency: ETH
                amount: '20124.50369697'
                amountNotional: '100621.31'
                available: '20124.50369697'
                availableNotional: '100621.31'
                availableForWithdrawal: '20124.50369697'
                availableForWithdrawalNotional: '100621.31'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/ApiKeyIpFilteringFailure'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
  /v1/addresses/{network}:
    post:
      x-zudoku-playground-enabled: false
      tags:
      - Fund Management
      summary: List Deposit Addresses
      operationId: listDepositAddresses
      description: 'Under the terms of the Gemini API Agreement, polling this endpoint may be subject to rate limiting. This endpoint is currently restricted further than our standard rate limiting to a rate of 1 request per 2 seconds per subaccount. This rate is subject to change and will be updated here accordingly.


        ### Roles

        The API key you use to access this endpoint must have the Trader, Fund Manager or Auditor role assigned. See Roles for more information.


        The OAuth scope must have `addresses:read` or `addresses:create` assigned to access this endpoint. See OAuth Scopes for more information.'
      parameters:
      - $ref: '#/components/parameters/networkParam'
      - $ref: '#/components/parameters/apiKeyAuth'
      - $ref: '#/components/parameters/signatureAuth'
      - $ref: '#/components/parameters/payloadAuth'
      - $ref: '#/components/parameters/contentType'
      - $ref: '#/components/parameters/contentLength'
      - $ref: '#/components/parameters/cacheControl'
      security:
      - apiKeyAuth: []
        signatureAuth: []
        payloadAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - request
              - nonce
              properties:
                request:
                  type: string
                  description: The literal string "/v1/addresses/network"
                nonce:
                  $ref: '#/components/schemas/Nonce'
                timestamp:
                  $ref: '#/components/schemas/TimestampType'
                  description: Only returns addresses created on or after this timestamp
                account:
                  type: string
                  description: Required for Master API keys. The name of the account within the subaccount group.
            examples:
              basic:
                summary: Basic Request
                description: Basic request to get Bitcoin deposit addresses
                value:
                  request: /v1/addresses/bitcoin
                  nonce: <nonce>
              withTimestamp:
                summary: With Timestamp
                description: Request with timestamp filter
                value:
                  request: /v1/addresses/ethereum
                  nonce: <nonce>
                  timestamp: 1591084414000
              withAccount:
                summary: With Account Parameter
                description: Request with account parameter for Master API keys
                value:
                  request: /v1/addresses/bitcoin
                  nonce: <nonce>
                  account: primary
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Address'
              examples:
                bitcoinAddresses:
                  summary: Bitcoin Addresses
                  description: Response with Bitcoin deposit addresses
                  value:
                  - address: n2saq73aDTu42bRgEHd8gd4to1gCzHxrdj
                    timestamp: 1424285102000
                    label: my bitcoin address
                  - address: n2wpl14aJEu10bRgMNd0gdjH8dHJ3h2a3ks
                    timestamp: 1824785101000
                ethereumAddresses:
                  summary: Ethereum Addresses
                  description: Response with Ethereum deposit addresses
                  value:
                  - address: '0x1f7a49d62d5256d0a80d31a07f57b578c3e40183'
                    timestamp: 1591084414000
                    label: main eth address
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/ApiKeyIpFilteringFailure'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
  /v1/deposit/{network}/newAddress:
    post:
      x-zudoku-playground-enabled: false
      tags:
      - Fund Management
      summary: Create New Deposit Address
      operationId: createNewDepositAddress
      description: 'Under the terms of the Gemini API Agreement, polling this endpoint may be subject to rate limiting. This endpoint is currently restricted further than our standard rate limiting to a rate of 1 request per 2 seconds per subaccount. This rate is subject to change and will be updated here accordingly.


        ### Roles

        The API key you use to access this endpoint must have the Fund Manager role assigned. See Roles for more information.


        The OAuth scope must have `addresses:create` assigned to access this endpoint. See OAuth Scopes for more information.'
      parameters:
      - $ref: '#/components/parameters/networkParam'
      - $ref: '#/components/parameters/apiKeyAuth'
      - $ref: '#/components/parameters/signatureAuth'
      - $ref: '#/components/parameters/payloadAuth'
      - $ref: '#/components/parameters/contentType'
      - $ref: '#/components/parameters/contentLength'
      - $ref: '#/components/parameters/cacheControl'
      security:
      - apiKeyAuth: []
        signatureAuth: []
        payloadAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - request
              - nonce
              properties:
                request:
                  type: string
                  description: The literal string "/v1/deposit/network/newAddress"
                nonce:
                  $ref: '#/components/schemas/Nonce'
                label:
                  type: string
                  description: A label for the address
                legacy:
                  type: boolean
                  description: Whether to generate a legacy P2SH-P2PKH litecoin address. False by default.
                account:
                  type: string
                  description: Required for Master API keys. The name of the account within the subaccount group.
            examples:
              basicBitcoin:
                summary: Basic Bitcoin Address Request
                description: Basic request to create a new Bitcoin deposit address
                value:
                  request: /v1/deposit/bitcoin/newAddress
                  nonce: <nonce>
                  label: optional test label
              legacyLitecoin:
                summary: Legacy Litecoin Address Request
                description: Request to create a legacy Litecoin deposit address
                value:
                  request: /v1/deposit/litecoin/newAddress
                  nonce: <nonce>
                  label: LTC legacy deposit address
                  legacy: true
              withAccount:
                summary: With Account Parameter
                description: Request with account parameter for Master API keys
                value:
                  request: /v1/deposit/ethereum/newAddress
                  nonce: <nonce>
                  label: ETH deposit address
                  account: primary
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Address'
              examples:
                bitcoinAddress:
                  summary: Bitcoin Address
                  description: Response with a new Bitcoin deposit address
                  value:
                    network: bitcoin
                    address: n2saq73aDTu42bRgEHd8gd4to1gCzHxrdj
                    label: optional test label
                litecoinAddress:
                  summary: Litecoin Address
                  description: Response with a new Litecoin deposit address
                  value:
                    network: litecoin
                    address: MJRSgZ3UUFcTBTBAcN38XAXvZLwRe8WVw7
                    label: LTC legacy deposit address
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/ApiKeyIpFilteringFailure'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
  /v2/transfers:
    post:
      x-zudoku-playground-enabled: false
      tags:
      - Fund Management
      summary: List Past Transfers
      operationId: listPastTransfers
      description: 'The v1 transfers endpoint is being retired. This v2 endpoint is the recommended replacement, offering full multichain support with accurate status for all supported networks. Please migrate to this endpoint at your earliest convenience.


        This endpoint shows deposits and withdrawals in supported currencies with full multichain (multi-network) support. It returns accurate status information for transfers on **all supported networks** including Solana, Arbitrum, Optimism, Base, Avalanche, and Ethereum.


        Each transfer in the response includes a `network` field identifying the blockchain network, along with network-specific `feeAmount`, `feeCurrency`, and `txHash` values.


        This endpoint does not currently show cancelled advances, returned outgoing wires or ACH transactions, or other exceptional transaction circumstances.


        Fiat transfers between non-derivative and derivatives accounts are prohibited.


        ### Roles

        The API key you use to access this endpoint must have the Trader, Fund Manager or Auditor role assigned. See Roles for more information.


        The OAuth scope must have `history:read` assigned to access this endpoint. See OAuth Scopes for more information.'
      parameters:
      - $ref: '#/components/parameters/apiKeyAuth'
      - $ref: '#/components/parameters/signatureAuth'
      - $ref: '#/components/parameters/payloadAuth'
      - $ref: '#/components/parameters/contentType'
      - $ref: '#/components/parameters/contentLength'
      - $ref: '#/components/parameters/cacheControl'
      security:
      - apiKeyAuth: []
        signatureAuth: []
        payloadAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - request
              - nonce
              properties:
                request:
                  type: string
                  description: The literal string "/v2/transfers"
                nonce:
                  $ref: '#/components/schemas/Nonce'
                currency:
                  type: string
                  description: Currency code, see symbols and minimums
                network:
                  type: string
                  description: Filter transfers by blockchain network (e.g., `ethereum`, `solana`, `arbitrum`, `optimism`, `base`, `avalanche`)
                timestamp:
                  $ref: '#/components/schemas/TimestampType'
                  description: Only return transfers after this timestamp
                limit_transfers:
                  type: integer
                  description: The maximum number of transfers to return. The default is 10 and the maximum is 50.
                account:
                  type: string
                  description: Required for Master API keys. The name of the account within the subaccount group.
                show_completed_deposit_advances:
                  type: boolean
                  description: Whether to display completed deposit advances. True by default.
            examples:
              basic:
                summary: Basic Request
                description: Basic request to get all transfers across all networks
                value:
                  request: /v2/transfers
                  nonce: <nonce>
              withCurrency:
                summary: With Currency Filter
                description: Request with currency filter for USDC transfers
                value:
                  request: /v2/transfers
                  nonce: <nonce>
                  currency: USDC
              withNetwork:
                summary: With Network Filter
                description: Request filtered to a specific network
                value:
                  request: /v2/transfers
                  nonce: <nonce>
                  currency: USDC
                  network: solana
              withFilters:
                summary: With Multiple Filters
                description: Request with timestamp, limit, and account filters
                value:
                  request: /v2/transfers
                  nonce: <nonce>
                  timestamp: 1591084414000
                  limit_transfers: 25
                  account: primary
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/V2Transfer'
              examples:
                multiNetworkTransfers:
                  summary: Multi-Network Transfers
                  description: Response with transfers across different networks
                  value:
                  - type: Withdrawal
                    status: Complete
                    timestampms: 1772818620354
                    eid: 368598436530
                    currency: USDC
                    amount: '0.01'
                    network: ethereum
                    feeAmount: '0.118856'
                    feeCurrency: USDC
                    txHash: 714a15c4fd2d37629d27e56a63aaec5f91e0053dde3eb357be71663c1197b391
                    destination: '0x83cFb8C13f06716b449E5D24F5b4cc6Cc64a189A'
                    withdrawalId: 69ab0b0f-3c76-433d-84a5-c8bcc6718411
                  - type: Withdrawal
                    status: Complete
                    timestampms: 1772034480391
                    eid: 368474658614
                    currency: USDC
                    amount: '1799'
                    network: solana
                    feeAmount: '0.202536'
                    feeCurrency: USDC
                    txHash: 4vJ9JU1bJJE96FWSJKvHsmmFADCg4gpZQff4P3bkLKi
                    withdrawalId: 9b7a5100-b3ee-4820-9b5b-c2dd7db6559b
                  - type: Deposit
                    status: Advanced
                    timestampms: 1771990797452
                    eid: 309356152
                    currency: ETH
                    amount: '100'
                    network: ethereum
                    feeAmount: '0'
                    feeCurrency: ETH
                    txHash: 605c5fa8bf99458d24d61e09941bc443ddc44839d9aaa508b14b296c0c8269b2
                adminTransactions:
                  summary: Administrative Transactions
                  description: Response with administrative credits and debits (no network field)
                  value:
                  - type: AdminDebit
                    status: Complete
                    timestampms: 1626990636645
                    eid: 1001248356
                    currency: BTC
                    amount: '6'
                    purpose: Administrative debit
                  - type: AdminCredit
                    status: Complete
                    timestampms: 1626990476421
                    eid: 1001245359
                    currency: BTC
                    amount: '4'
                    purpose: Fee reimbursement credit
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/ApiKeyIpFilteringFailure'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
  /v1/custodyaccountfees:
    post:
      x-zudoku-playground-enabled: false
      tags:
      - Fund Management
      summary: List Custody Fee Transfers
      operationId: listCustodyFeeTransfers
      description: 'Under the terms of the Gemini API Agreement, polling this endpoint may be subject to rate limiting. This endpoint is currently restricted further than our standard rate limiting to a rate of 1 request per 5 seconds per subaccount. This rate is subject to change and will be updated here accordingly. This is the same limit as the transfers endpoint. One call to one affects the other.


        This endpoint shows Custody fee records in the supported currencies.


        ### Roles

        The API key you use to access this endpoint must have the Trader, Fund Manager or Auditor role assigned. See Roles for more information.


        The OAuth scope must have `history:read` assigned to access this endpoint. See OAuth Scopes for more information.'
      parameters:
      - $ref: '#/components/parameters/apiKeyAuth'
      - $ref: '#/components/parameters/signatureAuth'
      - $ref: '#/components/parameters/payloadAuth'
      - $ref: '#/components/parameters/contentType'
      - $ref: '#/components/parameters/contentLength'
      - $ref: '#/components/parameters/cacheControl'
      security:
      - apiKeyAuth: []
        signatureAuth: []
        payloadAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - request
              - nonce
              properties:
                request:
                  type: string
                  description: The literal string "/v1/custodyaccountfees"
                nonce:
                  $ref: '#/components/schemas/Nonce'
                timestamp:
                  $ref: '#/components/schemas/TimestampType'
                  description: Only return Custody fee records on or after this timestamp
                limit_transfers:
                  type: integer
                  description: The maximum number of Custody fee records to return. The default is 10 and the maximum is 50.
                account:
                  type: string
                  description: Required for Master API keys. The name of the account within the subaccount group.
            examples:
              basic:
                summary: Basic Request
                description: Basic request to get custody account fees
                value:
                  request: /v1/custodyaccountfees
                  nonce: <nonce>
              withFilters:
                summary: With Filters
                description: Request with timestamp and limit filters
                value:
                  request: /v1/custodyaccountfees
                  nonce: <nonce>
                  timestamp: 1652279000000
                  limit_transfers: 20
              withAccount:
                summary: With Account Parameter
                description: Request with account parameter for Master API keys
                value:
                  request: /v1/custodyaccountfees
                  nonce: <nonce>
                  account: primary
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CustodyFeeTransfer'
              examples:
                multipleFees:
                  summary: Multiple Fee Records
                  description: Response with multiple custody fee records
                  value:
                  - txTime: 1657236174056
                    feeAmount: '10'
                    feeCurrency: BTC
                    eid: 256627
                    eventType: Withdrawal
                  - txTime: 1652279045196
                    feeAmount: '10000000'
                    feeCurrency: ETH
                    eid: 15364
                    eventType: CustodyFeeDebit
                  - txTime: 1652279025196
                    feeAmount: '1850'
                    feeCurrency: WFIL
                    eid: 9016
                    eventType: RiaFeeDebit
                  - txTime: 1652279025196
                    feeAmount: '1850'
                    feeCurrency: WFIL
                    eid: 9016
                    eventType: RiaFeeCredit
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/ApiKeyIpFilteringFailure'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
  /v2/withdraw/{network}/{ticker}/feeEstimate:
    post:
      x-zudoku-playground-enabled: false
      tags:
      - Fund Management
      summary: Get Gas Fee Estimation
      operationId: getGasFeeEstimation
      description: 'The v1 fee estimation endpoint is being retired. This v2 endpoint is the recommended replacement, offering explicit blockchain network selection for multi-network tokens. Please migrate to this endpoint at your earliest convenience.


