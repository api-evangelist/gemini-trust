role_errors:
  status: 403
  reason: MissingRole
  docs: https://developer.gemini.com/roles
  note: 'Role-based access control: Administrator (Master keys only), Trader (default), plus Fund Manager and Auditor
    roles configured per key.'
note: 'A genuinely rich first-party error registry: every reason is a stable machine-readable identifier with a stated
  meaning, which is what an agent needs to branch on. The gap is remediation - the table says what went wrong, not
  what to do about it, and there is no per-error retry guidance.'
