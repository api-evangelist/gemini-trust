    (e.g., `GEMI-FEDJAN26-DN25`). For active trading and market making, prefer [Prediction Markets WebSocket
    streams](/prediction-markets/websocket/streams) with that `instrumentSymbol`.

    - [List Events](/rest-api/prediction-markets/events/list-events) - Discover active events and instrument
    symbols

    - [Prediction Markets WebSocket Streams](/prediction-markets/websocket/streams) - Stream prices, depth,
    order events, and positions
