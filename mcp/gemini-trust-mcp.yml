deployment_note: 'There is NO hosted remote MCP endpoint. The server is TypeScript source inside the monorepo and
  is run by the MCP client as a local stdio process (node dist/index.js). Its package.json declares name "gemini-mcp"
  v1.0.1 but that npm name is owned by an unrelated publisher, so there is not even an npx one-liner: a human must
  clone and build before any agent can reach these tools. Credentials are passed as MCP client env vars (GEMINI_API_KEY,
  GEMINI_API_SECRET, GEMINI_ACCOUNT for master keys); public market-data tools work with no credentials.'
