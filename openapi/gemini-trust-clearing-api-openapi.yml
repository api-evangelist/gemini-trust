              - request
              - nonce
              properties:
                request:
                  type: string
                  description: The literal string "/v1/clearing/broker/list"
                nonce:
                  $ref: '#/components/schemas/Nonce'
                symbol:
                  type: string
                  description: Trading pair
                expiration_start:
                  $ref: '#/components/schemas/TimestampType'
                  description: UTC timestamp. Requires `expiration_end` if set
                expiration_end:
                  $ref: '#/components/schemas/TimestampType'
                  description: UTC timestamp. Requires `expiration_start` if set
                submission_start:
                  $ref: '#/components/schemas/TimestampType'
                  description: UTC timestamp. Requires `submission_end` if set
                submission_end:
                  $ref: '#/components/schemas/TimestampType'
                  description: UTC timestamp. Requires `submission_start` if set
                funded:
                  type: boolean
                  description: Default value false if not set
                status:
                  type: string
                  description: Filter by status
                timestamp:
                  $ref: '#/components/schemas/TimestampType'
                  description: Only return orders after this timestamp
                limit_orders:
                  type: integer
                  description: The maximum number of orders to return
                account:
                  type: string
                  description: Required for Master API keys. The name of the account within the subaccount group.
            examples:
              basic:
                summary: Basic Request
                description: Basic request to get broker clearing orders
                value:
                  request: /v1/clearing/broker/list
                  nonce: <nonce>
              withFilters:
                summary: With Filters
                description: Request with multiple filters
                value:
                  request: /v1/clearing/broker/list
                  nonce: <nonce>
                  symbol: BTCEUR
                  expiration_start: 1642222800000
                  expiration_end: 1642309200000
                  submission_start: 1641790800000
                  submission_end: 1641791100000
                  funded: false
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                type: object
                properties:
                  result:
                    type: string
                    description: Status of the operation
                  orders:
                    type: array
                    items:
                      type: object
                      properties:
                        clearing_id:
                          type: string
                          description: A unique identifier for the clearing order
                        source_counterparty_id:
                          type: string
                          description: Source counterparty id
                        source_order_id:
                          type: string
                          description: Only provided if order was submitted with it
                        target_counterparty_id:
                          type: string
                          description: Only provided if target counterparty was already set
                        target_order_id:
                          type: string
                          description: Only provided if target counterparty set this field
                        symbol:
                          type: string
                          description: Trading pair
                        source_side:
                          type: string
                          enum:
                          - buy
                          - sell
                          description: '"buy" or "sell"'
                        price:
                          type: number
                          format: decimal
                          description: The price the clearing order was executed at
                        quantity:
                          type: number
                          format: decimal
                          description: The amount that was executed
                        status:
                          type: string
                          description: A description of the status of the order
                        submission:
                          type: integer
                          description: UTC timestamp
                        expiration:
                          type: integer
                          description: UTC timestamp
              examples:
                successfulList:
                  summary: Successful List
                  description: JSON response with broker clearing orders
                  value:
                    result: success
                    orders:
                    - clearing_id: 9LVQ98X5
                      source_counterparty_id: R54L3DG1
                      source_order_id: trade1SrcOrderId
                      target_counterparty_id: KQ4P3XWE
                      target_order_id: trade1TgtOrderId
                      symbol: BTCEUR
                      source_side: buy
                      price: 1
                      quantity: 50
                      status: AwaitSourceConfirm
                      submission: 1641790800016
                      expiration: 1642222800000
                    - clearing_id: VXQ341X4
                      source_counterparty_id: R54L3DG1
                      source_order_id: trade4SrcOrderId
                      symbol: BTCEUR
                      source_side: buy
                      price: 4
                      quantity: 8
                      status: AwaitSourceTargetConfirm
                      submission: 1641790800028
                      expiration: 1642136400000
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/ApiKeyIpFilteringFailure'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
  /v1/clearing/broker/new:
    post:
      x-zudoku-playground-enabled: false
      tags:
      - Clearing
      summary: Create New Broker Order
      operationId: createNewBrokerOrder
      description: Gemini Clearing also allows for brokers to facilitate trades between two Gemini customers. A broker can submit a new Gemini Clearing order that must then be confirmed by each counterparty before settlement.
      parameters:
      - $ref: '#/components/parameters/apiKeyAuth'
      - $ref: '#/components/parameters/signatureAuth'
      - $ref: '#/components/parameters/payloadAuth'
      - $ref: '#/components/parameters/contentType'
      - $ref: '#/components/parameters/contentLength'
      - $ref: '#/components/parameters/cacheControl'
      security:
      - apiKeyAuth: []
        signatureAuth: []
        payloadAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - request
              - nonce
              - source_counterparty_id
              - target_counterparty_id
              - symbol
              - amount
              - expires_in_hrs
              - price
              - side
              properties:
                request:
                  type: string
                  description: The literal string "/v1/clearing/broker/new"
                nonce:
                  $ref: '#/components/schemas/Nonce'
                source_counterparty_id:
                  type: string
                  description: A symbol that corresponds with the counterparty sourcing the clearing trade
                target_counterparty_id:
                  type: string
                  description: A symbol that corresponds with the counterparty where the clearing trade is targeted
                symbol:
                  type: string
                  description: The [symbol](/market-data/symbols-and-minimums) of the order
                amount:
                  type: string
                  format: decimal
                  description: Quoted decimal amount to purchase
                expires_in_hrs:
                  type: integer
                  format: float
                  description: The number of hours before the trade expires. Your counterparty will need to confirm the order before this time expires.
                price:
                  type: string
                  format: decimal
                  description: Quoted decimal amount to spend per unit
                side:
                  type: string
                  enum:
                  - buy
                  - sell
                  description: '"buy" or "sell". This side will be assigned to the `source_counterparty_id`. The opposite side will be sent to the `target_counterparty_id`

                    '
                account:
                  type: string
                  description: Required for Master API keys as described in [Private API Invocation](/authentication/api-key#private-api-invocation). The name of the account within the subaccount group. Specifies the broker account on which to place the order. Only available for exchange accounts.
            examples:
              brokerOrderInitiation:
                summary: Broker order initiation sample
                description: Sample payload for broker order initiation
                value:
                  request: /v1/clearing/broker/new
                  nonce: <nonce>
                  source_counterparty_id: R485E04Q
                  target_counterparty_id: Z4929ZDY
                  symbol: ethusd
                  amount: '175.00'
                  expires_in_hrs: 1.0
                  price: '200'
                  side: sell
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                type: object
                properties:
                  result:
                    type: string
                    description: Will return `AwaitSourceTargetConfirm`, meaning the order is waiting for both the source and the target parties to confirm the order
                  clearing_id:
                    type: string
                    description: A unique identifier for the clearing order.
              example:
                result: AwaitSourceTargetConfirm
