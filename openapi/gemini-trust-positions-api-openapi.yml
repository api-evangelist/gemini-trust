openapi: 3.2.0
info:
  title: Gemini Prediction Markets Positions API
  description: 'API for trading prediction market contracts on Gemini.


    **Note:** Only fields documented in this specification are considered stable. Undocumented fields in API responses may change or be removed without notice.'
  version: 1.0.0
  contact:
    name: Gemini API Support
servers:
- url: https://api.gemini.com
  description: Production
- url: https://api.sandbox.gemini.com
  description: Sandbox
tags:
- name: Positions
  description: Authenticated endpoints for viewing positions and order history. Use REST positions for recovery or audit snapshots after reconnects, missed WebSocket messages, and settlement windows.
paths:
  /v1/prediction-markets/orders/active:
    post:
      tags:
      - Positions
      summary: Get active orders
      description: Returns a list of currently open (active) orders. Requires authentication.
      operationId: getActiveOrders
      security:
      - apiKey: []
        payloadAuth: []
        signatureAuth: []
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                symbol:
                  type: string
                  description: Filter by contract instrument symbol
                  example: GEMI-FEDJAN26-DN25
                limit:
                  type: integer
                  description: Maximum number of results to return (default 50, max 100)
                  default: 50
                  maximum: 100
                offset:
                  type: integer
                  description: Number of results to skip for pagination
                  default: 0
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrdersResponse'
              examples:
                activeOrders:
                  summary: List of active orders
                  value:
                    orders:
                    - orderId: 12345678901
                      status: open
                      symbol: GEMI-FEDJAN26-DN25
                      side: buy
                      outcome: 'yes'
                      orderType: limit
                      quantity: '100'
                      filledQuantity: '25'
                      remainingQuantity: '75'
                      price: '0.65'
                      avgExecutionPrice: '0.64'
                      createdAt: '2025-12-15T10:30:00.000Z'
                      updatedAt: '2025-12-15T11:00:00.000Z'
                      cancelledAt: null
                      contractMetadata:
                        contractId: contract_123
                        contractName: FEDJAN26-DN25
                        contractTicker: FEDJAN26-DN25
                        eventTicker: FEDJAN26
                        eventName: Will Fed Funds Rate drop at least 0.25% at January 2026 meeting?
                        category: economics
                        contractStatus: active
                        imageUrl: https://example.com/fed.png
                        expiryDate: '2026-01-31T23:59:59.000Z'
                        resolvedAt: null
                        description: Resolves YES if Federal Reserve lowers the target rate by 0.25% or more at the January 2026 FOMC meeting
                    - orderId: 12345678902
                      status: open
                      symbol: GEMI-FEDJAN26-DN25
                      side: sell
                      outcome: 'yes'
                      orderType: limit
                      quantity: '50'
                      filledQuantity: '0'
                      remainingQuantity: '50'
                      price: '0.65'
                      avgExecutionPrice: null
                      createdAt: '2025-12-15T12:00:00.000Z'
                      updatedAt: '2025-12-15T12:00:00.000Z'
                      cancelledAt: null
                      contractMetadata:
                        contractId: contract_123
                        contractName: FEDJAN26-DN25
                        contractTicker: FEDJAN26-DN25
                        eventTicker: FEDJAN26
                        eventName: Will Fed Funds Rate drop at least 0.25% at January 2026 meeting?
                        category: economics
                        contractStatus: active
                        imageUrl: https://example.com/fed.png
                        expiryDate: '2026-01-31T23:59:59.000Z'
                        resolvedAt: null
                        description: Resolves YES if Federal Reserve lowers the target rate by 0.25% or more at the January 2026 FOMC meeting
                    pagination:
                      limit: 50
                      offset: 0
                      count: 2
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /v1/prediction-markets/orders/history:
    post:
      tags:
      - Positions
      summary: Get order history
      description: 'Returns historical orders (filled or cancelled) for the authenticated user. Use `status: filled` with `from` and `to` to retrieve fully filled orders in a bounded time window. The range is `[from, to)`: `from` is inclusive and `to` is exclusive. A time-bounded response contains at most `limit` results and ignores `offset`; split high-volume periods into non-overlapping ranges. Use `/orders/active` for open orders.'
      operationId: getOrderHistory
      security:
      - apiKey: []
        payloadAuth: []
        signatureAuth: []
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                status:
                  type: string
                  description: Filter by order status
                  enum:
                  - filled
                  - cancelled
                symbol:
                  type: string
                  description: Filter by contract instrument symbol
                  example: GEMI-FEDJAN26-DN25
                limit:
                  type: integer
                  description: Maximum number of results to return. Defaults to 50 and is capped at 1000.
                  default: 50
                  minimum: 1
                  maximum: 1000
                offset:
                  type: integer
                  description: Number of results to skip for pagination. Offset is ignored when `from` or `to` is supplied.
                  default: 0
                  minimum: 0
                  maximum: 10000
                from:
                  type: integer
                  format: int64
                  description: Inclusive start of the order-closed time range, expressed as Unix epoch milliseconds. Use with `to` for a UTC daily window.
                  example: 1775001600000
                to:
                  type: integer
                  format: int64
                  description: Exclusive end of the order-closed time range, expressed as Unix epoch milliseconds. `from` must not be later than `to`.
                  example: 1775088000000
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrdersResponse'
        '400':
          description: Invalid status parameter or date range
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /v1/prediction-markets/positions:
    post:
      tags:
      - Positions
      summary: Get positions
      description: Returns current filled positions for the authenticated user. All query parameters are optional; omitting them preserves the legacy unpaginated, unsorted behavior.
      operationId: getPositions
      security:
      - apiKey: []
        payloadAuth: []
        signatureAuth: []
      parameters:
      - name: eventTicker
        in: query
        required: false
        description: Filter positions to a single event ticker (e.g. `FEDJAN26`). Positions on sub-events whose `parentEventTicker` matches the value may also be included.
        schema:
          type: string
      - name: limit
        in: query
        required: false
        description: Maximum number of positions to return. Clamped to `[1, 1000]` when supplied. Omit for legacy unpaginated behavior.
        schema:
          type: integer
          minimum: 1
          maximum: 1000
      - name: offset
        in: query
        required: false
        description: Number of positions to skip for pagination. Floor-clamped to `0` when supplied. Ignored when `limit` is omitted (the response is unpaginated).
        schema:
          type: integer
          minimum: 0
      - name: sort
        in: query
        required: false
        description: 'Sort order. Accepts `positionValue`, `unrealizedPnl`, or `expiryDate` (case-insensitive), optionally prefixed with `+` (ascending) or `-` (descending). A bare field name uses each field''s default direction: `positionValue` and `unrealizedPnl` default to descending; `expiryDate` defaults to ascending (soonest-first). `unrealizedPnl` and `expiryDate` sort NULLS LAST so positions without the sort key sink to the bottom regardless of direction. `instrumentId` ascending is the final tiebreaker for stable pagination across quote ticks. A malformed `sort` value silently falls back to `-positionValue` — no `400` is returned.

          '
        schema:
          type: string
          enum:
          - positionValue
          - +positionValue
          - -positionValue
          - unrealizedPnl
          - +unrealizedPnl
          - -unrealizedPnl
          - expiryDate
          - +expiryDate
          - -expiryDate
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PositionsResponse'
              examples:
                positions:
                  summary: User positions
                  value:
                    positions:
                    - symbol: GEMI-FEDJAN26-DN25
                      instrumentId: 1001
                      totalQuantity: '125'
                      quantityOnHold: '10'
                      avgPrice: '0.63'
                      outcome: 'yes'
                      contractMetadata:
                        contractId: contract_123
                        contractName: FEDJAN26-DN25
                        contractTicker: FEDJAN26-DN25
                        eventTicker: FEDJAN26
                        eventName: Will Fed Funds Rate drop at least 0.25% at January 2026 meeting?
                        category: economics
                        contractStatus: active
                        imageUrl: https://example.com/fed.png
                        eventImageUrl: https://example.com/fed-event.png
                        eventType: binary
                        expiryDate: '2026-01-31T23:59:59.000Z'
                        resolvedAt: null
                        resolutionSide: null
                        description: Resolves YES if Federal Reserve lowers the target rate by 0.25% or more at the January 2026 FOMC meeting
                        sortOrder: null
                        parentEventTicker: null
                        template: binary
                        color: null
                        startTime: null
                      prices:
                        buy:
                          'yes': '0.63'
                          'no': '0.37'
                        sell:
                          'yes': '0.61'
                          'no': '0.35'
                        bestBid: '0.61'
                        bestAsk: '0.63'
                        lastTradePrice: '0.62'
                      resolutionSide: null
                      isAboveAutoStartThreshold: false
                      isLive: true
                      realizedPl: '0'
                      marketValue: '78.75'
                      unrealizedPnl: '0'
                      unrealizedPct: 0
                    - symbol: GEMI-FEDJAN26-DN25
                      instrumentId: 1001
                      totalQuantity: '200'
                      quantityOnHold: '0'
                      avgPrice: '0.36'
                      outcome: 'no'
                      contractMetadata:
                        contractId: contract_123
                        contractName: FEDJAN26-DN25
                        contractTicker: FEDJAN26-DN25
                        eventTicker: FEDJAN26
                        eventName: Will Fed Funds Rate drop at least 0.25% at January 2026 meeting?
                        category: economics
                        contractStatus: active
                        imageUrl: https://example.com/fed.png
                        eventImageUrl: https://example.com/fed-event.png
                        eventType: binary
                        expiryDate: '2026-01-31T23:59:59.000Z'
                        resolvedAt: null
                        resolutionSide: null
                        description: Resolves YES if Federal Reserve lowers the target rate by 0.25% or more at the January 2026 FOMC meeting
                        sortOrder: null
                        parentEventTicker: null
                        template: binary
                        color: null
                        startTime: null
                      prices:
                        buy:
                          'yes': '0.37'
                          'no': '0.63'
                        sell:
                          'yes': '0.35'
                          'no': '0.61'
                        bestBid: '0.35'
                        bestAsk: '0.37'
                        lastTradePrice: '0.36'
                      resolutionSide: null
                      isAboveAutoStartThreshold: false
                      isLive: true
                      realizedPl: '0'
                      marketValue: '72.00'
                      unrealizedPnl: '0'
                      unrealizedPct: 0
                    total: 2
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /v1/prediction-markets/positions/settled:
    post:
      tags:
      - Positions
      summary: Get settled positions
      description: 'Returns historically settled positions for the authenticated user. Each entry represents a position in a contract that has resolved.

        - `payout` — the amount received from settlement

        - `resolutionSide` — indicates which outcome (`yes` or `no`) won.


        This endpoint differs from Get positions in that it returns closed positions from settled contracts rather than current open positions.'
      operationId: getSettledPositions
      security:
      - apiKey: []
        payloadAuth: []
        signatureAuth: []
      parameters:
      - name: eventTicker
        in: query
        description: Optional event ticker to filter settled positions to a single event (e.g. `FEDJAN26`). If omitted, all settled positions for the account are returned.
        required: false
        schema:
          type: string
      - name: limit
        in: query
        required: false
        description: Maximum number of settled positions to return.
        schema:
          type: integer
          default: 1000
          minimum: 1
          maximum: 1000
      - name: offset
        in: query
        required: false
        description: Number of settled positions to skip for pagination.
        schema:
          type: integer
          default: 0
          minimum: 0
      - name: sort
        in: query
        required: false
        description: 'Sort order. Accepts `date` or `payout`, optionally prefixed with `+` (ascending) or `-` (descending). A bare field name defaults to descending. `date` ascending is rejected and silently falls back to the default order — settled positions are conceptually ordered most-recent-first. A malformed `sort` value also falls back silently; no `400` is returned.

          '
        schema:
          type: string
          enum:
          - date
          - -date
          - payout
          - +payout
          - -payout
          example: -payout
      - name: search
        in: query
        required: false
        description: 'Case-insensitive substring filter. Matches against the event name, contract name, event ticker, or any ancestor category name in the contract''s category subtree (up to four levels). Whitespace is trimmed; inputs under 3 characters are dropped (GIN trigram lookup floor); inputs over 64 characters are truncated.

          '
        schema:
          type: string
      - name: category
        in: query
        required: false
        description: 'Filter to settled positions whose contract''s event belongs to the named category (or any of its descendants in the category tree). Whitespace is trimmed; empty values are ignored.

          '
        schema:
          type: string
          example: sports
      - name: withCashOuts
        in: query
        required: false
        description: 'Opt-in flag. When `true`, the response carries new sibling fields (`cashOuts`, `totalCashOutProceeds`, `totalCashOutCostBasis`, `totalCashOutNetProfit`) populated with the qualifying cash-outs in the same account-scoped time window as the returned page''s settled positions. When `false` (default) the response shape is byte-identical to the pre-`withCashOuts` contract: the `positions[]` element schema is unchanged regardless of the flag.

          '
        schema:
          type: boolean
          default: false
          example: true
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SettledPositionsResponse'
              examples:
                settledPositions:
                  summary: Settled positions with one winning and one losing position
                  value:
                    positions:
                    - accountId: 12345
                      instrumentId: 1001
                      instrumentSymbol: GEMI-FEDJAN26-DN25
                      position: '125'
                      positionQuantity: '125'
                      outcome: 'yes'
                      payout: '125.00'
                      resolutionSide: 'yes'
                      settledAt: '2026-01-31T23:59:59.000Z'
                      contractMetadata:
                        contractId: contract_123
                        contractName: FEDJAN26-DN25
                        contractTicker: FEDJAN26-DN25
                        eventTicker: FEDJAN26
                        eventName: Will Fed Funds Rate drop at least 0.25% at January 2026 meeting?
                        category: economics
                        contractStatus: resolved
                        imageUrl: https://example.com/fed.png
                        eventImageUrl: https://example.com/fed-event.png
                        eventType: binary
                        expiryDate: '2026-01-31T23:59:59.000Z'
                        resolvedAt: '2026-01-31T23:59:59.000Z'
                        resolutionSide: 'yes'
                        description: Resolves YES if Federal Reserve lowers the target rate by 0.25% or more at the January 2026 FOMC meeting
                        sortOrder: null
                        parentEventTicker: null
                        template: binary
                        color: null
                        startTime: null
                      costBasis: '78.75'
                      realizedPnl: '0'
                      netProfit: '46.25'
                    - accountId: 12345
                      instrumentId: 1002
                      instrumentSymbol: GEMI-FEDJAN26-NOCUT
                      position: '-200'
                      positionQuantity: '200'
                      outcome: 'no'
                      payout: '0'
                      resolutionSide: 'yes'
                      settledAt: '2026-01-31T23:59:59.000Z'
                      contractMetadata:
                        contractId: contract_124
                        contractName: FEDJAN26-NOCUT
                        contractTicker: FEDJAN26-NOCUT
                        eventTicker: FEDJAN26
                        eventName: Will Fed Funds Rate drop at least 0.25% at January 2026 meeting?
                        category: economics
