openapi: 3.2.0
info:
  title: REST Clearing API
  description: 'The Gemini Crypto Exchange REST API allows programmatic access to trade cryptocurrencies

    and manage your account on the Gemini Exchange platform. The API provides both public and

    private endpoints for market data, order management, and account operations.'
  version: 1.0.0
  contact:
    name: Gemini Trading Support
    email: trading@gemini.com
servers:
- url: https://api.gemini.com
  description: Production server
- url: https://api.sandbox.gemini.com
  description: Sandbox server for testing
tags:
- name: Clearing
paths:
  /v1/clearing/new:
    post:
      x-zudoku-playground-enabled: false
      tags:
      - Clearing
      summary: Create New Clearing Order
      operationId: createNewClearingOrder
      description: '### Roles

        The API key you use to access this endpoint must have the Trader role assigned. See Roles for more information.


        The OAuth scope must have `clearing:create` assigned to access this endpoint. See OAuth Scopes for more information.'
      parameters:
      - $ref: '#/components/parameters/apiKeyAuth'
      - $ref: '#/components/parameters/signatureAuth'
      - $ref: '#/components/parameters/payloadAuth'
      - $ref: '#/components/parameters/contentType'
      - $ref: '#/components/parameters/contentLength'
      - $ref: '#/components/parameters/cacheControl'
      security:
      - apiKeyAuth: []
        signatureAuth: []
        payloadAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - request
              - nonce
              - symbol
              - amount
              - price
              - side
              properties:
                request:
                  type: string
                  description: The literal string "/v1/clearing/new"
                nonce:
                  $ref: '#/components/schemas/Nonce'
                symbol:
                  type: string
                  description: The trading pair
                amount:
                  type: string
                  description: The amount to trade
                price:
                  type: string
                  description: The price
                side:
                  type: string
                  enum:
                  - buy
                  - sell
                  description: The direction of the trade
                counterparty_id:
                  type: string
                  description: The counterparty ID
                expires_in_hrs:
                  type: integer
                  description: The number of hours until the order expires
                account:
                  type: string
                  description: Required for Master API keys. The name of the account within the subaccount group.
            examples:
              newClearingOrder:
                summary: New Clearing Order
                description: JSON payload for creating a new clearing order
                value:
                  request: /v1/clearing/new
                  nonce: <nonce>
                  counterparty_id: OM9VNL1G
                  expires_in_hrs: 24
                  symbol: btcusd
                  amount: '100'
                  price: '9500.00'
                  side: buy
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClearingOrder'
              example:
                result: AwaitConfirm
                clearing_id: 0OQGOZXW
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/ApiKeyIpFilteringFailure'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
  /v1/clearing/status:
    post:
      x-zudoku-playground-enabled: false
      tags:
      - Clearing
      summary: Get Clearing Order
      operationId: getClearingOrder
      description: '### Roles

        The API key you use to access this endpoint must have the Trader role assigned. See Roles for more information.


        The OAuth scope must have `clearing:read` assigned to access this endpoint. See OAuth Scopes for more information.'
      parameters:
      - $ref: '#/components/parameters/apiKeyAuth'
      - $ref: '#/components/parameters/signatureAuth'
      - $ref: '#/components/parameters/payloadAuth'
      - $ref: '#/components/parameters/contentType'
      - $ref: '#/components/parameters/contentLength'
      - $ref: '#/components/parameters/cacheControl'
      security:
      - apiKeyAuth: []
        signatureAuth: []
        payloadAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - request
              - nonce
              - clearing_id
              properties:
                request:
                  type: string
                  description: The literal string "/v1/clearing/status"
                nonce:
                  $ref: '#/components/schemas/Nonce'
                clearing_id:
                  type: string
                  description: The clearing ID
                account:
                  type: string
                  description: Required for Master API keys. The name of the account within the subaccount group.
            examples:
              orderStatusRequest:
                summary: Order Status Request
                description: JSON payload for checking clearing order status
                value:
                  request: /v1/clearing/status
                  nonce: <nonce>
                  clearing_id: OM9VNL1G
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClearingOrder'
              example:
                result: ok
                status: Confirmed
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/ApiKeyIpFilteringFailure'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
  /v1/clearing/cancel:
    post:
      x-zudoku-playground-enabled: false
      tags:
      - Clearing
      summary: Cancel Clearing Order
      operationId: cancelClearingOrder
      description: '### Roles

        The API key you use to access this endpoint must have the Trader role assigned. See Roles for more information.


        The OAuth scope must have `clearing:create` assigned to access this endpoint. See OAuth Scopes for more information.'
      parameters:
      - $ref: '#/components/parameters/apiKeyAuth'
      - $ref: '#/components/parameters/signatureAuth'
      - $ref: '#/components/parameters/payloadAuth'
      - $ref: '#/components/parameters/contentType'
      - $ref: '#/components/parameters/contentLength'
      - $ref: '#/components/parameters/cacheControl'
      security:
      - apiKeyAuth: []
        signatureAuth: []
        payloadAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - request
              - nonce
              - clearing_id
              properties:
                request:
                  type: string
                  description: The literal string "/v1/clearing/cancel"
                nonce:
                  $ref: '#/components/schemas/Nonce'
                clearing_id:
                  type: string
                  description: The clearing ID
                account:
                  type: string
                  description: Required for Master API keys. The name of the account within the subaccount group.
            examples:
              cancelOrderRequest:
                summary: Cancel Order Request
                description: JSON payload for canceling a clearing order
                value:
                  request: /v1/clearing/cancel
                  nonce: <nonce>
                  clearing_id: P0521QDV
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                type: object
                properties:
                  result:
                    type: string
                    description: Status of the cancel operation
                  details:
                    type: string
                    description: Detailed description of the result
              examples:
                successfulCancel:
                  summary: Successful Cancel
                  description: JSON response for successful order cancellation
                  value:
                    result: ok
                    details: P0521QDV order canceled
                failedCancel:
                  summary: Failed Cancel
                  description: JSON response for failed order cancellation
                  value:
                    result: failed
                    details: Unable to cancel order P0521QDV
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/ApiKeyIpFilteringFailure'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
  /v1/clearing/confirm:
    post:
      x-zudoku-playground-enabled: false
      tags:
      - Clearing
      summary: Confirm Clearing Order
      operationId: confirmClearingOrder
      description: '### Roles

        The API key you use to access this endpoint must have the Trader role assigned. See Roles for more information.


        The OAuth scope must have `clearing:create` assigned to access this endpoint. See OAuth Scopes for more information.'
      parameters:
      - $ref: '#/components/parameters/apiKeyAuth'
      - $ref: '#/components/parameters/signatureAuth'
      - $ref: '#/components/parameters/payloadAuth'
      - $ref: '#/components/parameters/contentType'
      - $ref: '#/components/parameters/contentLength'
      - $ref: '#/components/parameters/cacheControl'
      security:
      - apiKeyAuth: []
        signatureAuth: []
        payloadAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - request
              - nonce
              - clearing_id
              - symbol
              - amount
              - price
              - side
              properties:
                request:
                  type: string
                  description: The literal string "/v1/clearing/confirm"
                nonce:
                  $ref: '#/components/schemas/Nonce'
                clearing_id:
                  type: string
                  description: The clearing ID
                symbol:
                  type: string
                  description: The trading pair
                amount:
                  type: string
                  description: The amount to trade
                price:
                  type: string
                  description: The price
                side:
                  type: string
                  enum:
                  - buy
                  - sell
                  description: The direction of the trade
                account:
                  type: string
                  description: Required for Master API keys. The name of the account within the subaccount group.
            examples:
              confirmOrderRequest:
                summary: Confirm Order Request
                description: JSON payload for confirming a clearing order
                value:
                  request: /v1/clearing/confirm
                  nonce: <nonce>
                  clearing_id: OM9VNL1G
                  symbol: btcusd
                  amount: '100'
                  price: '9500.00'
                  side: sell
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                type: object
                properties:
                  result:
                    type: string
                    description: Status of the confirmation operation
              examples:
                successfulConfirm:
                  summary: Successful Confirmation
                  description: JSON response for successful order confirmation
                  value:
                    result: confirmed
                failedConfirm:
                  summary: Failed Confirmation
                  description: JSON response for failed order confirmation
                  value:
                    result: error
                    reason: InvalidSide
                    message: 'Invalid side for symbol BTCUSD: ''buy'''
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/ApiKeyIpFilteringFailure'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
  /v1/clearing/list:
    post:
      x-zudoku-playground-enabled: false
      tags:
      - Clearing
      summary: List Clearing Orders
      operationId: listClearingOrders
      description: '### Roles

        The API key you use to access this endpoint must have the Trader role assigned. See Roles for more information.


        The OAuth scope must have `clearing:read` assigned to access this endpoint. See OAuth Scopes for more information.'
      parameters:
      - $ref: '#/components/parameters/apiKeyAuth'
      - $ref: '#/components/parameters/signatureAuth'
      - $ref: '#/components/parameters/payloadAuth'
      - $ref: '#/components/parameters/contentType'
      - $ref: '#/components/parameters/contentLength'
      - $ref: '#/components/parameters/cacheControl'
      security:
      - apiKeyAuth: []
        signatureAuth: []
        payloadAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - request
              - nonce
              properties:
                request:
                  type: string
                  description: The literal string "/v1/clearing/list"
                nonce:
                  $ref: '#/components/schemas/Nonce'
                symbol:
                  type: string
                  description: Trading pair
                counterparty:
                  type: string
                  description: counterparty_id or counterparty_alias
                side:
                  type: string
                  enum:
                  - buy
                  - sell
                  description: '"buy" or "sell"'
                expiration_start:
                  $ref: '#/components/schemas/TimestampType'
                  description: UTC timestamp. Requires `expiration_end` if set
                expiration_end:
                  $ref: '#/components/schemas/TimestampType'
                  description: UTC timestamp. Requires `expiration_start` if set
                submission_start:
                  $ref: '#/components/schemas/TimestampType'
                  description: UTC timestamp. Requires `submission_end` if set
                submission_end:
                  $ref: '#/components/schemas/TimestampType'
                  description: UTC timestamp. Requires `submission_start` if set
                funded:
                  type: boolean
                  description: Default value false if not set
                status:
                  type: string
                  description: Filter by status
                timestamp:
                  $ref: '#/components/schemas/TimestampType'
                  description: Only return orders after this timestamp
                limit_orders:
                  type: integer
                  description: The maximum number of orders to return
                account:
                  type: string
                  description: Required for Master API keys. The name of the account within the subaccount group.
            examples:
              basic:
                summary: Basic Request
                description: Basic request to get clearing orders
                value:
                  request: /v1/clearing/list
                  nonce: <nonce>
              withFilters:
                summary: With Filters
                description: Request with multiple filters
                value:
                  request: /v1/clearing/list
                  nonce: <nonce>
                  symbol: BTCEUR
                  counterparty: KQ4P3XWE
                  side: buy
                  expiration_start: 1642222800000
                  expiration_end: 1642309200000
                  submission_start: 1641790800000
                  submission_end: 1641791100000
                  funded: false
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                type: object
                properties:
                  result:
                    type: string
                    description: Status of the operation
                  orders:
                    type: array
                    items:
                      type: object
                      properties:
                        clearing_id:
                          type: string
                          description: A unique identifier for the clearing order
                        order_id:
                          type: string
                          description: Only provided if order was submitted with it
                        counterparty_id:
                          type: string
                          description: A symbol that corresponds with a counterparty
                        counterparty_alias:
                          type: string
                          description: Counterparty alias
                        broker_id:
                          type: string
                          description: A symbol that corresponds with a broker id
                        symbol:
                          type: string
                          description: Trading pair
                        side:
                          type: string
                          enum:
                          - buy
                          - sell
                          description: '"buy" or "sell"'
                        price:
                          type: number
                          format: decimal
                          description: The price the clearing order was executed at
                        quantity:
                          type: number
                          format: decimal
                          description: The amount that was executed
                        status:
                          type: string
                          description: A description of the status of the order
                        submission:
                          $ref: '#/components/schemas/TimestampType'
                          description: UTC timestamp
                        expiration:
                          $ref: '#/components/schemas/TimestampType'
                          description: UTC timestamp
              examples:
                successfulList:
                  summary: Successful List
                  description: JSON response with clearing orders
                  value:
                    result: success
                    orders:
                    - clearing_id: 9LVQE9X5
                      counterparty_id: YZ43LX81
                      symbol: BTCEUR
                      side: sell
                      price: 2
                      quantity: 10
                      status: AwaitTargetConfirm
                      submission: 1641790800020
                      expiration: 1641963600000
                    - clearing_id: 2MYR07XP
                      order_id: trade1SrcOrderId
                      counterparty_id: KQ4P3XWE
                      broker_id: WV4V1DGN
                      symbol: BTCEUR
                      side: buy
                      price: 1
                      quantity: 50
                      status: AwaitSourceConfirm
                      submission: 1641790800016
                      expiration: 1642222800000
                    - clearing_id: EM8WO7LQ
                      order_id: trade4SrcOrderId
                      broker_id: WV4V1DGN
                      symbol: BTCEUR
                      side: buy
                      price: 4
                      quantity: 8
                      status: AwaitSourceTargetConfirm
                      submission: 1641790800028
                      expiration: 1642136400000
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/ApiKeyIpFilteringFailure'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
  /v1/clearing/broker/list:
    post:
      x-zudoku-playground-enabled: false
      tags:
      - Clearing
      summary: List Clearing Brokers
      operationId: listClearingBrokers
      description: '### Roles

        The API key you use to access this endpoint must have the Trader role assigned. See Roles for more information.


        The OAuth scope must have `clearing:read` assigned to access this endpoint. See OAuth Scopes for more information.'
      parameters:
      - $ref: '#/components/parameters/apiKeyAuth'
      - $ref: '#/components/parameters/signatureAuth'
      - $ref: '#/components/parameters/payloadAuth'
      - $ref: '#/components/parameters/contentType'
