response_headers_note: 'Gemini publishes NO rate-limit response headers. No X-RateLimit-*, no RateLimit-* (RFC 9238
  draft), and no Retry-After is documented anywhere in the rate-limit page, the error-codes page or either OpenAPI.
  An agent gets a 429 and nothing else: it cannot read remaining budget, reset time, or a server-suggested backoff.
  This is the single clearest runtime-signal gap in an otherwise strong contract.'
burst: Five additional requests are queued (not rejected) above the rate; processing is delayed until the request
  rate falls back under the limit. Beyond the burst, requests receive 429 immediately.
