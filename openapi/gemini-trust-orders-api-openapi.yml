  /v1/mytrades:
    post:
      x-zudoku-playground-enabled: false
      tags:
      - Orders
      summary: List Past Trades
      operationId: listPastTrades
      description: 'Gemini recommends using our WebSocket Order Events API to be notified when a trade executes on your account instead of polling this endpoint.


        Under the terms of the Gemini API Agreement, polling this endpoint may be subject to rate limiting.


        Enabled for perpetuals accounts from July 10th, 0100hrs ET onwards. Trade info for all perpetuals orders submitted prior to this timing, will not be available through this API.


        ### Roles

        The API key you use to access this endpoint must have the Trader or Auditor role assigned. See Roles for more information.


        The OAuth scope must have `history:read` assigned to access this endpoint. See OAuth Scopes for more information.


        ### How to retrieve your trade history


        To retrieve your full trade history walking backwards,


        1. Initial request: `POST` to https://api.gemini.com/v1/mytrades with a JSON payload including a `timestamp` key with value 0 and a `limit_trades` key with value `500`

        2. When you receive the list of trades, it will be sorted by `timestamp` descending - so the first element in the list will have the highest `timestamp` value. For this example, say that value is `X`.

        3. Create a second `POST` request with a JSON payload including a `timestamp` key with value `X+1` and a `limit_trades` key with value `500`.

        4. Take the first element of the list returned with highest `timestamp` value `Y` and create a third `POST` request with a JSON payload including a `timestamp` key with value `Y+1` and a `limit_trades` key with value `500`.

        5. Continue creating `POST` requests and retrieving trades until an empty list is returned.


        ### Break Types


        In the rare event that a trade has been reversed (broken), the trade that is broken will have this flag set. The field will contain one of these values


        |Value|Description|

        |--- |--- |

        |manual|The trade was reversed manually. This means that all fees, proceeds, and debits associated with the trade have been credited or debited to the account seperately. That means that this reported trade must be included for order for the account balance to be correct.|

        |full|The trade was fully broken. The reported trade should not be accounted for. It will be as though the transfer of fund associated with the trade had simply not happened.|'
      parameters:
      - $ref: '#/components/parameters/apiKeyAuth'
      - $ref: '#/components/parameters/signatureAuth'
      - $ref: '#/components/parameters/payloadAuth'
      - $ref: '#/components/parameters/contentType'
      - $ref: '#/components/parameters/contentLength'
      - $ref: '#/components/parameters/cacheControl'
      security:
      - apiKeyAuth: []
        signatureAuth: []
        payloadAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MyTradesRequest'
            examples:
              basic:
                summary: Basic Request
                description: Basic request to get past trades for a symbol
                value:
                  request: /v1/mytrades
                  nonce: <nonce>
                  symbol: btcusd
              withLimitAndTimestamp:
                summary: With Limit and Timestamp
                description: Request with limit and timestamp parameters
                value:
                  request: /v1/mytrades
                  nonce: <nonce>
                  symbol: btcusd
                  limit_trades: 100
                  timestamp: 1591084414000
              withAccount:
                summary: With Account Parameter
                description: Request with account parameter for Master API keys
                value:
                  request: /v1/mytrades
                  nonce: <nonce>
                  symbol: btcusd
                  account: primary
      responses:
        '200':
          description: The past trades
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/MyTrade'
              examples:
                multipleTrades:
                  summary: Multiple Trades
                  description: Response with multiple trades
                  value:
                  - price: '3648.09'
                    amount: '0.0027343246'
                    timestamp: 1547232911
                    timestampms: 1547232911021
                    type: Buy
                    aggressor: true
                    fee_currency: USD
                    fee_amount: '0.024937655575035'
                    tid: 107317526
                    order_id: '107317524'
                    exchange: gemini
                    is_clearing_fill: false
                    symbol: BTCUSD
                  - price: '3633.00'
                    amount: '0.00423677'
                    timestamp: 1547220640
                    timestampms: 1547220640195
                    type: Buy
                    aggressor: false
                    fee_currency: USD
                    fee_amount: '0.038480463525'
                    tid: 106921823
                    order_id: '106817811'
                    exchange: gemini
                    is_clearing_fill: false
                    symbol: BTCUSD
                withClientOrderId:
                  summary: Trade with Client Order ID
                  description: Response with a trade that includes client_order_id
                  value:
                  - price: '42000.00'
                    amount: '0.5'
                    timestamp: 1616492376
                    timestampms: 1616492376594
                    type: Sell
                    aggressor: true
                    fee_currency: USD
