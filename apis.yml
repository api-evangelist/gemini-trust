- name: Gemini Crypto Trading REST API
  description: 'The Gemini Exchange REST API for spot, margin and perpetuals trading: market data, order placement
    and cancellation, past trades, clearing, fund management, deposit addresses, withdrawals, sub-account administration,
    roles, margin and staking. Authenticated with an API key plus a base64 X-GEMINI-PAYLOAD and a hex HMAC-SHA384
    X-GEMINI-SIGNATURE; 74 operations across 74 paths.'
