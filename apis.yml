aid: gemini-trust
name: Gemini Trust Company
description: Gemini Trust Company, LLC is a United States cryptocurrency exchange and custodian, founded in 2014
  and headquartered in New York, regulated as a New York State Department of Financial Services trust company. It
  operates the Gemini Exchange and the Gemini Developer Platform, publishing OpenAPI 3.0.3 contracts for its Crypto
  Trading REST API and Prediction Markets REST API, an AsyncAPI 3.0.0 contract for the wss://ws.gemini.com WebSocket
  API, plus a FIX gateway. The platform covers spot, margin, perpetuals, prediction markets, staking, clearing,
  custody and institutional fund management, with API-key HMAC-SHA384 signing and OAuth 2.0 authorization-code +
  PKCE, including FDX-namespaced scopes.
