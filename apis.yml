- name: Gemini MCP Server
  description: The official first-party Model Context Protocol server from the gemini/developer-platform monorepo,
    exposing Gemini market data, orders, funds, account, margin, staking, prediction-market and native-OS alert
    tools to MCP clients. Distributed as source in the monorepo and run over local stdio; there is no hosted remote
    endpoint.
