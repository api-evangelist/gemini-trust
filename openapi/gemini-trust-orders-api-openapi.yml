openapi: 3.2.0
info:
  title: REST Orders API
  description: 'The Gemini Crypto Exchange REST API allows programmatic access to trade cryptocurrencies

    and manage your account on the Gemini Exchange platform. The API provides both public and

    private endpoints for market data, order management, and account operations.'
  version: 1.0.0
  contact:
    name: Gemini Trading Support
    email: trading@gemini.com
servers:
- url: https://api.gemini.com
  description: Production server
- url: https://api.sandbox.gemini.com
  description: Sandbox server for testing
tags:
- name: Orders
paths:
  /v1/order/new:
    post:
      x-zudoku-playground-enabled: false
      tags:
      - Orders
      summary: Create New Order
      operationId: createNewOrder
      description: 'If you wish orders to be automatically cancelled when your session ends, see the require heartbeat section, or manually send the cancel all session orders message.


        Master API keys do not support cancelation on disconnect via heartbeat.


        Enabled for perpetuals accounts from July 10th, 0100hrs ET onwards.


        ### Roles

        The API key you use to access this endpoint must have the Trader role assigned. See Roles for more information.


        The OAuth scope must have `orders:create` assigned to access this endpoint. See OAuth Scopes for more information.


        ### Margin Orders

        Set `margin_order: true` to place an order using borrowed funds on a margin-enabled account. This allows you to trade with leverage beyond your available balance.


        **Important**: Margin trading amplifies both gains and losses. Monitor your account using the Margin Account Summary endpoint and preview order impacts with Order Preview before placing margin orders.


        ### Stop-Limit Orders

        A Stop-Limit order is an order type that allows for order placement when a price reaches a specified level. Stop-Limit orders take in both a `price` and and a `stop_price` as parameters. The `stop_price` is the price that triggers the order to be placed on the continous live order book at the `price`. For buy orders, the `stop_price` must be below the `price` while sell orders require the `stop_price` to be greater than the `price`.


        ### What about market orders?

        The API doesn''t directly support market orders because they provide you with no price protection.


        Instead, use the “immediate-or-cancel” order execution option, coupled with an aggressive limit price (i.e. very high for a buy order or very low for a sell order), to achieve the same result.


        ### Order execution options

        Note that `options` is an array. If you omit `options` or provide an empty array, your order will be a standard limit order - it will immediately fill against any open orders at an equal or better price, then the remainder of the order will be posted to the order book.


        If you specify more than one option (or an unsupported option) in the `options` array, the exchange will reject your order.


        No `options` can be applied to stop-limit orders at this time.


        The available limit order options are:


        | Option | Description |

        |--------|-------------|

        | `"maker-or-cancel"` | This order will only add liquidity to the order book.


        If any part of the order could be filled immediately, the whole order will instead be canceled before any execution occurs.


        If that happens, the response back from the API will indicate that the order has already been canceled (`"is_cancelled": true` in JSON).


        *Note: some other exchanges call this option "post-only".* |

        | `"immediate-or-cancel"` | This order will only remove liquidity from the order book.


        It will fill whatever part of the order it can immediately, then cancel any remaining amount so that no part of the order is added to the order book.


        If the order doesn''t fully fill immediately, the response back from the API will indicate that the order has already been canceled (`"is_cancelled": true` in JSON). |

        | `"fill-or-kill"` | This order will only remove liquidity from the order book.


        It will fill the entire order immediately or cancel.


        If the order doesn''t fully fill immediately, the response back from the API will indicate that the order has already been canceled (`"is_cancelled": true` in JSON). |'
      parameters:
      - $ref: '#/components/parameters/apiKeyAuth'
      - $ref: '#/components/parameters/signatureAuth'
      - $ref: '#/components/parameters/payloadAuth'
      - $ref: '#/components/parameters/contentType'
      - $ref: '#/components/parameters/contentLength'
      - $ref: '#/components/parameters/cacheControl'
      security:
      - apiKeyAuth: []
        signatureAuth: []
        payloadAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NewOrderRequest'
            examples:
              limitOrder:
                summary: Limit Order
                description: JSON limit order payload
                value:
                  request: /v1/order/new
                  nonce: <nonce>
                  client_order_id: '470135'
                  symbol: BTCUSD
                  amount: '5'
                  price: '3633.00'
                  side: buy
                  type: exchange limit
              stopLimitOrder:
                summary: Stop-Limit Order
                description: JSON stop-limit order payload
                value:
                  request: /v1/order/new
                  nonce: <nonce>
                  client_order_id: '921841'
                  symbol: BTCUSD
                  amount: '0.1'
                  price: '10500'
                  side: buy
                  type: exchange stop limit
                  stop_price: '10000'
              marginOrder:
                summary: Margin Order
                description: JSON margin order payload using borrowed funds
                value:
                  request: /v1/order/new
                  nonce: <nonce>
                  client_order_id: '384729'
                  symbol: ETHUSD
                  amount: '2.5'
                  price: '3200.00'
                  side: buy
                  type: exchange limit
                  margin_order: true
      responses:
        '200':
          description: Response will be the fields included in Order Status
          content:
            application/json:
              schema:
                oneOf:
                - $ref: '#/components/schemas/LimitOrderResponse'
                - $ref: '#/components/schemas/StopLimitOrderResponse'
              examples:
                limitOrder:
                  summary: Limit Order
                  description: JSON limit order response
                  value:
                    order_id: '106817811'
                    id: '106817811'
                    symbol: BTCUSD
                    exchange: gemini
                    avg_execution_price: '3632.8508430064554'
                    side: buy
                    type: exchange limit
                    timestamp: '1547220404'
                    timestampms: 1547220404836
                    is_live: true
                    is_cancelled: false
                    is_hidden: false
                    was_forced: false
                    executed_amount: '3.7567928949'
                    remaining_amount: '1.2432071051'
                    client_order_id: 20190110-4738721
                    options: []
                    price: '3633.00'
                    original_amount: '5'
                stopLimitOrder:
                  summary: Stop-Limit Order
                  description: JSON stop-limit order response
                  value:
                    order_id: '7419662'
                    id: '7419662'
                    symbol: BTCUSD
                    exchange: gemini
                    avg_execution_price: '0.00'
                    side: buy
                    type: stop-limit
                    timestamp: '1572378649'
                    timestampms: 1572378649018
                    is_live: true
                    is_cancelled: false
                    is_hidden: false
                    was_forced: false
                    executed_amount: '0'
                    options: []
                    stop_price: '10400.00'
                    price: '10500.00'
                    original_amount: '0.01'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/ApiKeyIpFilteringFailure'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
  /v1/order/cancel:
    post:
      x-zudoku-playground-enabled: false
      tags:
      - Orders
      summary: Cancel Order
      operationId: cancelOrder
      description: 'This will cancel an order. If the order is already canceled, the message will succeed but have no effect.


        Enabled for perpetuals accounts from July 10th, 0100hrs ET onwards.


        ### Roles

        The API key you use to access this endpoint must have the Trader role assigned. See Roles for more information.


        The OAuth scope must have `orders:create` assigned to access this endpoint. See OAuth Scopes for more information.


        ### All Cancellation Reasons

        Under unique circumstances, orders may be automatically cancelled by the exchange. These scenarios are detailed in the table below:


        | Cancel Reason | Description |

        |---------------|-------------|

        | `MakerOrCancelWouldTake` | Occurs when the "maker-or-cancel" execution option is included in the order request and any part of the requested order could be filled immediately. |

        | `ExceedsPriceLimits` | Occurs when there is not sufficient liquidity on the order book to support the entered trade. Orders will be automatically cancelled when liquidity conditions are such that the order would move price +/- 5%. |

        | `SelfCrossPrevented` | Occurs when a user enters a bid that is higher than that user''s lowest open ask or enters an ask that is lower than their highest open bid on the same pair. |

        | `ImmediateOrCancelWouldPost` | Occurs when the "immediate-or-cancel" execution option is included in the order request and the requested order cannot be fully filled immediately. This type of cancellation will only cancel the unfulfilled part of any impacted order. |

        | `FillOrKillWouldNotFill` | Occurs when the "fill-or-kill" execution option is included in the new order request and the entire order cannot be filled immediately.


        Unlike "immediate-or-cancel" orders, this execution option will result in the entire order being cancelled rather than just the unfulfilled portion. |

        | `Requested` | Cancelled via user request to /v1/order/cancel endpoint. |

        | `MarketClosed` | Occurs when an order is placed for a trading pair that is currently closed. |

        | `TradingClosed` | Occurs when an order is placed while the exchange is closed for trading. |'
      parameters:
      - $ref: '#/components/parameters/apiKeyAuth'
      - $ref: '#/components/parameters/signatureAuth'
      - $ref: '#/components/parameters/payloadAuth'
      - $ref: '#/components/parameters/contentType'
      - $ref: '#/components/parameters/contentLength'
      - $ref: '#/components/parameters/cacheControl'
      security:
      - apiKeyAuth: []
        signatureAuth: []
        payloadAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CancelOrderRequest'
            examples:
              cancelOrder:
                summary: Cancel Order Example
                description: JSON payload to cancel an order using its order_id
                value:
                  request: /v1/order/cancel
                  nonce: <nonce>
                  order_id: 106817811
      responses:
        '200':
          description: Response will be the fields included in Order Status. If the order was already canceled, then the request will have no effect and the status will be returned. Note the *is_cancelled* node will have a value of 'true'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CancelOrderResponse'
              examples:
                cancelledOrder:
                  summary: Cancelled Order
                  description: JSON response for a cancelled order
                  value:
                    order_id: '106817811'
                    id: '106817811'
                    symbol: btcusd
                    exchange: gemini
                    avg_execution_price: '3632.85101103'
                    side: buy
                    type: exchange limit
                    timestamp: '1495742383'
                    timestampms: 1495742383345
                    is_live: false
                    is_cancelled: true
                    is_hidden: false
                    was_forced: false
                    executed_amount: '3.7610296649'
                    remaining_amount: '1.2389703351'
                    reason: Requested
                    options: []
                    price: '2960.00'
                    original_amount: '5'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/ApiKeyIpFilteringFailure'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
  /v1/order/cancel/all:
    post:
      x-zudoku-playground-enabled: false
      tags:
      - Orders
      summary: Cancel All Active Orders
      operationId: cancelAllActiveOrders
      description: 'This will cancel all outstanding orders created by all sessions owned by this account, including interactive orders placed through the UI.


        Note that this cancels orders that were not placed using this API key.

        Enabled for perpetuals accounts from July 10th, 0100hrs ET onwards.


        Typically Cancel All Session Orders is preferable, so that only orders related to the current connected session are cancelled.


        ### Roles

        The API key you use to access this endpoint must have the Trader role assigned. See Roles for more information.


        The OAuth scope must have `orders:create` assigned to access this endpoint. See OAuth Scopes for more information.'
      parameters:
      - $ref: '#/components/parameters/apiKeyAuth'
      - $ref: '#/components/parameters/signatureAuth'
      - $ref: '#/components/parameters/payloadAuth'
      - $ref: '#/components/parameters/contentType'
      - $ref: '#/components/parameters/contentLength'
      - $ref: '#/components/parameters/cacheControl'
      security:
      - apiKeyAuth: []
        signatureAuth: []
        payloadAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CancelAllOrdersRequest'
            examples:
              cancelAllOrders:
                summary: Cancel All Orders
                description: JSON payload to cancel all orders
                value:
                  request: /v1/order/cancel/all
                  nonce: <nonce>
      responses:
        '200':
          description: JSON response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CancelAllResult'
              example:
                result: ok
                details:
                  cancelRejects: []
                  cancelledOrders:
                  - 330429106
                  - 330429079
                  - 330429082
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/ApiKeyIpFilteringFailure'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
  /v1/order/cancel/session:
    post:
      x-zudoku-playground-enabled: false
      tags:
      - Orders
      summary: Cancel All Session Orders
      operationId: cancelAllSessionOrders
      description: 'This will cancel all orders opened by this session.


        This will have the same effect as heartbeat expiration if "Require Heartbeat" is selected for the session.


        ### Roles

        The API key you use to access this endpoint must have the Trader role assigned. See Roles for more information.


        The OAuth scope must have `orders:create` assigned to access this endpoint. See OAuth Scopes for more information.'
      parameters:
      - $ref: '#/components/parameters/apiKeyAuth'
      - $ref: '#/components/parameters/signatureAuth'
      - $ref: '#/components/parameters/payloadAuth'
      - $ref: '#/components/parameters/contentType'
      - $ref: '#/components/parameters/contentLength'
      - $ref: '#/components/parameters/cacheControl'
      security:
      - apiKeyAuth: []
        signatureAuth: []
        payloadAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CancelAllOrdersBySessionRequest'
            examples:
              cancelAllSessionOrders:
                summary: Cancel All Session Orders
                description: JSON payload to cancel all orders opened by this session
                value:
                  request: /v1/order/cancel/session
                  nonce: <nonce>
      responses:
        '200':
          description: JSON response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CancelAllResult'
              example:
                result: ok
                details:
                  cancelRejects:
                  - 330429345
                  cancelledOrders: []
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/ApiKeyIpFilteringFailure'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
  /v1/order/status:
    post:
      x-zudoku-playground-enabled: false
      tags:
      - Orders
      summary: Get Order Status
      operationId: getOrderStatus
      description: 'Gemini recommends using our WebSocket Order Events API to receive order status changes. It''s much better because you''ll be notified of order status changes as they happen.


        Under the terms of the Gemini API Agreement, polling this endpoint may be subject to rate limiting.


        Enabled for perpetuals accounts from July 10th, 0100hrs ET onwards. Trade info for all perpetuals orders submitted prior to this timing, will not be available through this API.


        ### Roles

        The API key you use to access this endpoint must have the Trader role assigned. See Roles for more information.


        The OAuth scope must have `orders:read` assigned to access this endpoint. See OAuth Scopes for more information.'
      parameters:
      - $ref: '#/components/parameters/apiKeyAuth'
      - $ref: '#/components/parameters/signatureAuth'
      - $ref: '#/components/parameters/payloadAuth'
      - $ref: '#/components/parameters/contentType'
      - $ref: '#/components/parameters/contentLength'
      - $ref: '#/components/parameters/cacheControl'
      security:
      - apiKeyAuth: []
        signatureAuth: []
        payloadAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OrderStatusRequest'
            examples:
              orderStatusRequest:
                value:
                  request: /v1/order/status
                  nonce: <nonce>
                  order_id: 123456789012345
                  include_trades: true
      responses:
        '200':
          description: The order status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
              examples:
                limitBuyResponse:
                  summary: Limit Buy Response
                  description: JSON response for limit buy
                  value:
                    order_id: '123456789012345'
                    id: '123456789012345'
                    symbol: btcusd
                    exchange: gemini
                    avg_execution_price: '400.00'
                    side: buy
                    type: exchange limit
                    timestamp: '1494870642'
                    timestampms: 1494870642156
                    is_live: false
                    is_cancelled: false
                    is_hidden: false
                    was_forced: false
                    executed_amount: '3'
                    remaining_amount: '0'
                    options: []
                    price: '400.00'
                    original_amount: '3'
                includeTradesResponse:
                  summary: Include Trades Response
                  description: JSON response for market buy with include_trades as True
                  value:
                    avg_execution_price: '22728.94'
                    exchange: gemini
                    executed_amount: '0.0219983861'
                    id: '17379712927'
                    is_cancelled: false
                    is_hidden: false
                    is_live: false
                    options: []
                    order_id: '17379712927'
                    remaining_amount: '0'
                    side: buy
                    symbol: btcusd
                    timestamp: '1608229172'
                    timestampms: 1608229172627
                    trades:
                    - aggressor: true
                      amount: '0.0219983861'
                      exchange: gemini
                      fee_amount: '0.00'
                      fee_currency: USD
                      order_id: '17379712927'
                      price: '22728.94'
                      tid: 17379712930
                      timestamp: 1608229172
                      timestampms: 1608229172627
                      type: Buy
                    type: market buy
                    was_forced: false
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/ApiKeyIpFilteringFailure'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
  /v1/orders:
    post:
      x-zudoku-playground-enabled: false
      tags:
      - Orders
      summary: List Active Orders
      operationId: listActiveOrders
      description: 'Gemini recommends using our WebSocket Order Events API to maintain a current view of your active orders. It''s both faster and more efficient than polling this endpoint.


        Under the terms of the Gemini API Agreement, polling this endpoint may be subject to rate limiting.


        Enabled for perpetuals accounts from July 10th, 0100hrs ET onwards.


        ### Roles

        The API key you use to access this endpoint must have the Trader or Auditor role assigned. See Roles for more information.


        The OAuth scope must have `orders:read` assigned to access this endpoint. See OAuth Scopes for more information.'
      parameters:
      - $ref: '#/components/parameters/apiKeyAuth'
      - $ref: '#/components/parameters/signatureAuth'
      - $ref: '#/components/parameters/payloadAuth'
      - $ref: '#/components/parameters/contentType'
      - $ref: '#/components/parameters/contentLength'
      - $ref: '#/components/parameters/cacheControl'
      security:
      - apiKeyAuth: []
        signatureAuth: []
        payloadAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - request
              - nonce
              properties:
                request:
                  type: string
                  description: The API endpoint path
                  example: /v1/orders
                nonce:
                  type: TimestampType
                  $ref: '#/components/schemas/TimestampType'
                  title: The nonce, as described in [Private API Invocation](/authentication/api-key#private-api-invocation)
                account:
                  type: string
                  description: Required for Master API keys as described in [Private API Invocation](/authentication/api-key#private-api-invocation). The name of the account within the subaccount group. Specifies the account on which you intend to place the order. Only available for exchange accounts.
                  example: primary
            examples:
              basic:
                summary: Basic Request
                description: Basic request to get active orders
                value:
                  request: /v1/orders
                  nonce: <nonce>
              withAccount:
                summary: With Account Parameter
                description: Request with account parameter for Master API keys
                value:
                  request: /v1/orders
                  nonce: <nonce>
                  account: primary
      responses:
        '200':
          description: The active orders
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Order'
              examples:
                multipleOrders:
                  summary: Multiple Active Orders
                  description: Response with multiple active orders
                  value:
                  - order_id: '107421210'
                    id: '107421210'
                    symbol: ethusd
                    exchange: gemini
                    avg_execution_price: '0.00'
                    side: sell
                    type: exchange limit
                    timestamp: '1547241628'
                    timestampms: 1547241628042
                    is_live: true
                    is_cancelled: false
                    is_hidden: false
                    was_forced: false
                    executed_amount: '0'
                    remaining_amount: '1'
                    options: []
                    price: '125.51'
                    original_amount: '1'
                  - order_id: '107421205'
                    id: '107421205'
                    symbol: ethusd
                    exchange: gemini
                    avg_execution_price: '125.41'
                    side: buy
                    type: exchange limit
                    timestamp: '1547241626'
                    timestampms: 1547241626991
                    is_live: true
                    is_cancelled: false
                    is_hidden: false
                    was_forced: false
                    executed_amount: '0.029147'
                    remaining_amount: '0.970853'
                    options: []
                    price: '125.42'
                    original_amount: '1'
                emptyOrders:
                  summary: No Active Orders
                  description: Response when there are no active orders
                  value: []
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/ApiKeyIpFilteringFailure'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
  /v1/orders/history:
    post:
      x-zudoku-playground-enabled: false
      tags:
      - Orders
      summary: List Past Orders
      operationId: listPastOrders
      description: 'This API retrieves (closed) orders history for an account.


        ### Roles

        The API key you use to access this endpoint must have the Trader or Auditor role assigned. See Roles for more information.


        The OAuth scope must have `history:read` assigned to access this endpoint. See OAuth Scopes for more information.


        ### How to retrieve your order history


        To retrieve your full order history walking backwards,


        1. Initial request: `POST` to https://api.gemini.com/v1/orders/history with a JSON payload including a `timestamp` key with value `0` and a `limit_orders` key with value `500`

        2. When you receive the list of orders, it will be sorted by `timestamp` descending - so the first element in the list will have the highest `timestamp` value. For this example, say that value is `X`.

        3. Create a second `POST` request with a JSON payload including a `timestamp` key with value `X+1` and a `limit_orders` key with value `500`.

        4. Take the first element of the list returned with highest `timestamp` value `Y` and create a third `POST` request with a JSON payload including a `timestamp` key with value `Y+1` and a `limit_orders` key with value `500`.

        5. Continue creating `POST` requests and retrieving orders until an empty list is returned.


        ### Break Types


        In the rare event that a trade has been reversed (broken), the trade that is broken will have this flag set. The field will contain one of these values


        |Value|Description|

        |--- |--- |

        |manual|The trade was reversed manually. This means that all fees, proceeds, and debits associated with the trade have been credited or debited to the account seperately. That means that this reported trade must be included for order for the account balance to be correct.|

        |full|The trade was fully broken. The reported trade should not be accounted for. It will be as though the transfer of fund associated with the trade had simply not happened.|'
      parameters:
      - $ref: '#/components/parameters/apiKeyAuth'
      - $ref: '#/components/parameters/signatureAuth'
      - $ref: '#/components/parameters/payloadAuth'
      - $ref: '#/components/parameters/contentType'
      - $ref: '#/components/parameters/contentLength'
      - $ref: '#/components/parameters/cacheControl'
      security:
      - apiKeyAuth: []
        signatureAuth: []
        payloadAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - request
              - nonce
              properties:
                request:
                  type: string
                  description: The API endpoint `/v1/orders/history`
                nonce:
                  $ref: '#/components/schemas/Nonce'
                symbol:
                  type: string
                  description: The symbol to retrieve orders for
                limit_orders:
                  type: integer
