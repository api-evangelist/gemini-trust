                      - id: contract_123
                        label: BTC reaches $100,000 by end of 2028
                        description: null
                        prices:
                          buy:
                            'yes': '0.65'
                            'no': '0.35'
                          sell:
                            'yes': '0.65'
                            'no': '0.35'
                          bestBid: '0.64'
